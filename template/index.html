<!DOCTYPE html>
<html lang="uk" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаблон звіту / Дашборду</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
  <!-- Шапка -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="../" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Назад до хабу">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">Назва нового звіту</h1>
          <p class="text-xs text-slate-400">Короткий опис або період аналізу</p>
        </div>
      </div>
      <div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 font-medium">
          Дашборд
        </span>
      </div>
    </div>
  </header>

  <!-- Основний контент -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- KPI Картки -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800">
        <span class="text-xs font-semibold text-slate-400 uppercase">Метрика 1</span>
        <div class="mt-2 text-2xl font-bold text-white">0.00</div>
        <p class="text-xs text-emerald-400 mt-1">+0% динаміка</p>
      </div>
      <div class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800">
        <span class="text-xs font-semibold text-slate-400 uppercase">Метрика 2</span>
        <div class="mt-2 text-2xl font-bold text-white">0</div>
        <p class="text-xs text-slate-400 mt-1">Опис показника</p>
      </div>
      <div class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800">
        <span class="text-xs font-semibold text-slate-400 uppercase">Метрика 3</span>
        <div class="mt-2 text-2xl font-bold text-white">0%</div>
        <p class="text-xs text-slate-400 mt-1">Конверсія</p>
      </div>
      <div class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800">
        <span class="text-xs font-semibold text-slate-400 uppercase">Метрика 4</span>
        <div class="mt-2 text-2xl font-bold text-white">0</div>
        <p class="text-xs text-slate-400 mt-1">Результат</p>
      </div>
    </div>

    <!-- Графік -->
    <div class="p-5 rounded-2xl bg-slate-900/80 border border-slate-800">
      <h2 class="text-sm font-semibold text-white mb-4">Графік динаміки</h2>
      <div class="relative w-full h-80">
        <canvas id="mainChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    const ctx = document.getElementById('mainChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'],
        datasets: [{
          label: 'Показник',
          data: [12, 19, 3, 5, 2, 3, 9],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          tension: 0.35,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { color: 'rgba(51, 65, 85, 0.25)' }, ticks: { color: '#94a3b8' } },
          y: { grid: { color: 'rgba(51, 65, 85, 0.25)' }, ticks: { color: '#94a3b8' } }
        },
        plugins: {
          legend: { labels: { color: '#cbd5e1' } }
        }
      }
    });
  </script>
</body>
</html>
